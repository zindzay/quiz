schema: spec-driven

context: |
  Веб-приложение с карточками «вопрос — ответ». Бэкенд — Java, сборка Gradle (Kotlin DSL).
  Хранилище — только локальный CSV-файл (UTF-8, RFC 4180, заголовок в первой строке); СУБД не используется.
  Доступ к CSV инкапсулирован за интерфейсом репозитория; запись атомарная (временный файл + ATOMIC_MOVE).
  Предполагается один экземпляр приложения на файл данных.
  Изменение формата CSV (новые поля карточки) должно быть явно описано в design.md вместе с миграцией существующего файла.
  Все артефакты OpenSpec пишутся на русском языке; идентификаторы изменений — kebab-case на английском.

rules:
  design:
    - Новые зависимости в build.gradle.kts перечислять с обоснованием
  specs:
    - Требования формулировать через SHALL/MUST со сценариями WHEN/THEN
  tasks:
    - Каждый сценарий из спецификаций должен быть покрыт задачей на тест
    - Последняя задача — убедиться, что ./gradlew build проходит

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
